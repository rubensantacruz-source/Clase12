<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso 04</title>
    <link rel="stylesheet" href="css/style03.css">
</head>
<body>
    <main>
        <section class="panel" aria-labelledby="panel-title">
            <div class="panel-inner">
                <div class="panel-header"><strong id="panel-title">Rendimiento mensual</strong></div>
                <div class="stat-box">
                    <div class="stat-inner">
                        <div class="stat-line"></div>
                        <div class="stat-value" id="statValue">+4,250</div>
                        <div class="stat-sub">Nuevos usuarios activos</div>
                    </div>
                </div>
                <p class="live-note">Los datos se actualizan en tiempo real según interacciones del panel.</p>
                <button type="button" class="sync-btn" id="syncBtn">Sincronizar panel</button>
            </div>
        </section>
    </main>

    <script>
        const syncButton = document.getElementById('syncBtn');
        if (syncButton) {
            syncButton.addEventListener('click', () => {
                syncButton.classList.add('pressed');
                window.setTimeout(() => syncButton.classList.remove('pressed'), 380);
            });
        }
    </script>
</body>
</html>
